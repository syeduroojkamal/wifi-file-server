<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WiFi File Server — FOSS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans leading-relaxed p-6">
    <div class="max-w-4xl mx-auto">
        <header class="flex flex-wrap justify-between items-center gap-4 mb-6">
            <h2 class="text-2xl font-bold tracking-tight">WiFi File Server</h2>
            <div id="stats" class="text-slate-400 text-sm"></div>
        </header>

        <div class="flex gap-3 flex-wrap mb-6">
            <button class="bg-slate-800 text-slate-100 border border-slate-700 hover:bg-slate-700 transition px-4 py-2 rounded-md font-semibold text-sm cursor-pointer" onclick="createFolder()">
                New Folder
            </button>
            <label class="bg-sky-400 text-slate-950 hover:bg-sky-300 transition px-4 py-2 rounded-md font-semibold text-sm cursor-pointer inline-flex items-center">
                Upload Files
                <input type="file" id="file-input" multiple class="hidden" onchange="uploadFiles(this.files)">
            </label>
        </div>

        <div class="flex items-center gap-3 mb-5">
            <button class="bg-slate-800 text-slate-100 border border-slate-700 hover:bg-slate-700 transition px-4 py-2.5 rounded-md font-semibold text-sm cursor-pointer shrink-0" onclick="navigateUp()">
                ❮
            </button>
            <div id="current-path" class="bg-slate-800 border border-slate-700 px-4 py-2.5 rounded-lg font-mono text-sm break-all flex flex-wrap items-center gap-2 min-w-0 flex-1">
                /
            </div>
        </div>

        <div class="bg-slate-800 border border-slate-700 rounded-lg overflow-x-auto shadow-sm mb-5">
            <table class="w-full text-left border-collapse text-sm">
                <thead>
                    <tr class="border-b border-slate-700 text-slate-400 font-medium">
                        <th class="px-4 py-3">Name</th>
                        <th class="px-4 py-3">Size</th>
                        <th class="px-4 py-3 text-right">Action</th>
                    </tr>
                </thead>
                <tbody id="file-list" class="divide-y divide-slate-700/60"></tbody>
            </table>
        </div>

        <div id="drop-zone" class="border-2 border-dashed border-slate-700 rounded-lg p-6 text-center text-slate-400 mb-6 cursor-pointer transition">
            Drag and drop files here to upload directly
        </div>

        <div id="transfer-progress" class="hidden mt-6">
            <div class="flex justify-between items-center gap-3 mb-3">
                <h3 class="font-semibold">Transfers</h3>
                <button
                    class="text-slate-400 hover:text-slate-100 text-sm cursor-pointer"
                    onclick="dismissTransferProgress()"
                >
                    Dismiss
                </button>
            </div>
            <div id="transfer-progress-list" class="space-y-3"></div>
        </div>
    </div>

    <script>
        let currentPath = '';
        let uploadQueue = Promise.resolve();

        async function fetchDirectory(path = '') {
            currentPath = path;
            renderCurrentPath(path);
            const res = await fetch(`/api/list?path=${encodeURIComponent(path)}`);
            if (!res.ok) return alert('Failed to read folder');
            const items = await res.json();
            const tbody = document.getElementById('file-list');
            tbody.innerHTML = '';

            // Complex
            // items.sort((a, b) => b.isDir - a.isDir || a.name.localeCompare(b.name));

            // Less Complex
            items.sort((a, b) => {
                if (a.isDir !== b.isDir) {
                    return b.isDir - a.isDir; // folders first
                }
                return a.name.localeCompare(b.name); // then alphabetical
            });

            items.forEach(item => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-700/50 transition';
                const relPath = path ? `${path}/${item.name}` : item.name;

                if (item.isDir) {
                    tr.innerHTML = `
                        <td class="px-4 py-3">📁 <a href="javascript:void(0)" onclick="fetchDirectory('${relPath}')" class="text-sky-400 hover:underline break-all font-medium">${item.name}</a></td>
                        <td class="px-4 py-3 text-slate-400">Folder</td>
                        <td class="px-4 py-3 text-right"><button class="text-sky-400 hover:text-sky-300 text-lg mr-3 cursor-pointer" onclick="downloadFolder('${relPath}', '${item.name}')" aria-label="Download ${item.name} as ZIP" title="Download folder as ZIP">📦</button><button class="text-amber-400 hover:text-amber-300 hover:underline text-xs font-medium mr-3 cursor-pointer" onclick="moveItem(decodeURIComponent('${encodeURIComponent(relPath).replace(/'/g, '%27')}'))">Move</button><button class="text-rose-400 hover:text-rose-300 hover:underline text-xs font-medium cursor-pointer" onclick="deleteItem('${relPath}')">Delete</button></td>
                    `;
                } else {
                    tr.innerHTML = `
                        <td class="px-4 py-3">📄 <a href="/api/download?path=${encodeURIComponent(relPath)}" download class="text-sky-400 hover:underline break-all">${item.name}</a></td>
                        <td class="px-4 py-3 text-slate-400">${formatBytes(item.size)}</td>
                        <td class="px-4 py-3 text-right"><a href="/api/download?path=${encodeURIComponent(relPath)}" download aria-label="Download ${item.name}" title="Download" class="text-sky-400 hover:text-sky-300 text-lg mr-3">⬇️</a><button class="text-amber-400 hover:text-amber-300 hover:underline text-xs font-medium mr-3 cursor-pointer" onclick="moveItem(decodeURIComponent('${encodeURIComponent(relPath).replace(/'/g, '%27')}'))">Move</button><button class="text-rose-400 hover:text-rose-300 hover:underline text-xs font-medium cursor-pointer" onclick="deleteItem('${relPath}')">Delete</button></td>
                    `;
                }
                tbody.appendChild(tr);
            });
        }

        function renderCurrentPath(path) {
            const currentPathElement = document.getElementById('current-path');
            currentPathElement.replaceChildren();

            const root = document.createElement('span');
            root.textContent = '/';
            currentPathElement.appendChild(root);

            if (!path) return;

            path.split('/').forEach((folder) => {
                const separator = document.createElement('span');
                separator.className = 'text-slate-500';
                separator.textContent = '❯';
                currentPathElement.appendChild(separator);

                const folderElement = document.createElement('span');
                folderElement.textContent = folder;
                currentPathElement.appendChild(folderElement);
            });
        }

        function formatBytes(bytes) {
            if (!bytes || bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        }

        function navigateUp() {
            if (!currentPath) return;
            const parts = currentPath.split('/');
            parts.pop();
            fetchDirectory(parts.join('/'));
        }

        function downloadFolder(path, name) {
            if (!confirm(`Create and download a ZIP archive of "${name}"? This may take some time.`)) return;
            startZipDownload(path, name);
        }

        async function createFolder() {
            const name = prompt('Folder Name:');
            if (!name) return;
            const path = currentPath ? `${currentPath}/${name}` : name;
            const res = await fetch(`/api/create-folder?path=${encodeURIComponent(path)}`, { method: 'POST' });
            if (res.ok) fetchDirectory(currentPath);
            else alert('Failed to create folder');
        }

        async function deleteItem(path) {
            if (!confirm(`Delete ${path}?`)) return;
            const res = await fetch(`/api/delete?path=${encodeURIComponent(path)}`, { method: 'POST' });
            if (res.ok) fetchDirectory(currentPath);
            else alert('Delete failed');
        }

        async function moveItem(path) {
            const destination = prompt('Move to folder (relative path, blank for root):', currentPath);
            if (destination === null) return;
            const normalizedDestination = destination.trim().replace(/^\/+|\/+$/g, '');
            const res = await fetch(
                `/api/move?from=${encodeURIComponent(path)}&to=${encodeURIComponent(normalizedDestination)}`,
                { method: 'POST' }
            );
            if (res.ok) fetchDirectory(currentPath);
            else alert(await res.text() || 'Move failed');
        }

        function uploadFile(file, progressElement, statusElement) {
            return new Promise((resolve, reject) => {
                const xhr = new XMLHttpRequest();
                const formData = new FormData();
                formData.append('file', file);
                formData.append('path', currentPath);

                xhr.upload.addEventListener('progress', (event) => {
                    if (!event.lengthComputable) return;
                    const percent = Math.round((event.loaded / event.total) * 100);
                    progressElement.value = percent;
                    statusElement.textContent = `${percent}%`;
                });

                xhr.addEventListener('load', () => {
                    if (xhr.status >= 200 && xhr.status < 300) {
                        progressElement.value = 100;
                        statusElement.textContent = 'Done';
                        resolve();
                    } else {
                        reject(new Error(`Upload failed (${xhr.status})`));
                    }
                });
                xhr.addEventListener('error', () => reject(new Error('Network error')));
                xhr.open('POST', '/api/upload');
                xhr.send(formData);
            });
        }

        async function uploadFiles(files) {
            if (!files.length) return;

            const progressList = document.getElementById('transfer-progress');
            const progressItems = document.getElementById('transfer-progress-list');
            progressList.classList.remove('hidden');

            for (const file of files) {
                const row = document.createElement('div');
                row.className = 'bg-slate-800 border border-slate-700 rounded-lg p-3';

                const label = document.createElement('div');
                label.className = 'flex justify-between gap-3 text-sm mb-2';
                const name = document.createElement('span');
                name.className = 'truncate';
                name.textContent = file.name;
                const status = document.createElement('span');
                status.className = 'text-slate-400 shrink-0';
                status.textContent = '0%';
                label.append(name, status);

                const progress = document.createElement('progress');
                progress.className = 'w-full h-2 accent-sky-400';
                progress.max = 100;
                progress.value = 0;
                row.append(label, progress);
                progressItems.appendChild(row);

                uploadQueue = uploadQueue.then(async () => {
                    try {
                        await uploadFile(file, progress, status);
                        await fetchDirectory(currentPath);
                    } catch (error) {
                        status.className = 'text-rose-400 shrink-0';
                        status.textContent = error.message;
                    }
                });
            }
        }

        async function startZipDownload(path, name) {
            const progressList = document.getElementById('transfer-progress');
            const progressItems = document.getElementById('transfer-progress-list');
            progressList.classList.remove('hidden');

            const row = document.createElement('div');
            row.className = 'bg-slate-800 border border-slate-700 rounded-lg p-3';
            const label = document.createElement('div');
            label.className = 'flex justify-between gap-3 text-sm mb-2';
            const title = document.createElement('span');
            title.className = 'truncate';
            title.textContent = `Creating ZIP: ${name}`;
            const status = document.createElement('span');
            status.className = 'text-slate-400 shrink-0';
            status.textContent = 'Starting';
            label.append(title, status);
            const progress = document.createElement('progress');
            progress.className = 'w-full h-2 accent-sky-400';
            progress.max = 100;
            progress.value = 0;
            row.append(label, progress);
            progressItems.appendChild(row);

            try {
                const response = await fetch(`/api/zip?path=${encodeURIComponent(path)}`, { method: 'POST' });
                if (!response.ok) throw new Error('Failed to start ZIP creation');
                const { jobId } = await response.json();
                pollZipProgress(jobId, name, progress, status);
            } catch (error) {
                status.className = 'text-rose-400 shrink-0';
                status.textContent = error.message;
            }
        }

        async function pollZipProgress(jobId, name, progress, status) {
            try {
                const response = await fetch(`/api/zip-progress?job=${encodeURIComponent(jobId)}`);
                if (!response.ok) throw new Error('Failed to read ZIP progress');
                const job = await response.json();
                progress.value = job.progress;
                status.textContent = `${job.progress}%`;

                if (job.state === 'complete') {
                    progress.value = 100;
                    status.textContent = 'Downloading';
                    window.location.href = `/api/download?job=${encodeURIComponent(jobId)}`;
                } else if (job.state === 'failed') {
                    throw new Error(job.error || 'ZIP creation failed');
                } else {
                    setTimeout(() => pollZipProgress(jobId, name, progress, status), 500);
                }
            } catch (error) {
                status.className = 'text-rose-400 shrink-0';
                status.textContent = error.message;
            }
        }

        function dismissTransferProgress() {
            const progressList = document.getElementById('transfer-progress');
            document.getElementById('transfer-progress-list').innerHTML = '';
            progressList.classList.add('hidden');
        }

        const dropZone = document.getElementById('drop-zone');
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('border-sky-400', 'bg-slate-800');
        });
        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('border-sky-400', 'bg-slate-800');
        });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('border-sky-400', 'bg-slate-800');
            if (e.dataTransfer.files.length) uploadFiles(e.dataTransfer.files);
        });

        fetchDirectory('');
    </script>
</body>
</html>
